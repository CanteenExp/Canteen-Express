{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{% static 'customer_portal/images/canteen-express-logo.png' %}" type="image/png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Personnel Portal - Canteen Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#FF6117',
                            dark: '#1E1E1E',
                            card: '#292929',
                            light: '#EAEAEA',
                            slate: '#8E8E93',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-brand-dark text-brand-light min-h-screen flex flex-col justify-between p-6 sm:p-8 max-w-md mx-auto w-full select-none">

    <!-- Header Brand -->
    <header class="flex justify-center pt-2">
        <div class="flex items-center gap-2">
            <img src="{% static 'customer_portal/images/canteen-express-logo.png' %}" alt="Logo" class="h-8 w-auto object-contain">
            <span class="text-xs font-bold uppercase tracking-[0.2em] text-brand-light/95">CANTEEN EXPRESS</span>
        </div>
    </header>

    <div class="my-auto py-8">
        <div class="bg-brand-card rounded-3xl p-8 border border-white/10 shadow-2xl space-y-6">
            <div class="text-center">
                <div class="w-14 h-14 bg-brand-orange/10 border border-brand-orange/20 text-brand-orange rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-brand-orange/10">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <h2 class="text-2xl font-black text-brand-light mt-3">Delivery Personnel Portal</h2>
                <p class="text-brand-slate text-xs mt-1">Sign in with your Delivery Rider credentials</p>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                {% if error %}
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-xs font-semibold">
                        <p>{{ error }}</p>
                    </div>
                {% endif %}

                <div>
                    <label class="block text-xs font-extrabold text-brand-slate uppercase tracking-wider mb-1">Username</label>
                    <input type="text" name="username" required placeholder="Rider username"
                           class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-white/10 text-brand-light placeholder-brand-slate/60 focus:ring-2 focus:ring-brand-orange focus:outline-none text-sm font-semibold">
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-brand-slate uppercase tracking-wider mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-3 rounded-xl bg-brand-dark border border-white/10 text-brand-light placeholder-brand-slate/60 focus:ring-2 focus:ring-brand-orange focus:outline-none text-sm font-semibold">
                </div>

                <button type="submit" class="w-full bg-brand-orange hover:opacity-90 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-brand-orange/20 transition cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Rider Login
                </button>
            </form>

            <div class="text-center pt-2 border-t border-white/5">
                <a href="{% url 'accounts:landing' %}" class="text-xs font-bold text-brand-slate hover:text-brand-orange transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-arrow-left"></i> Back to Role Selection
                </a>
            </div>
        </div>
    </div>

    <footer class="pb-2 text-center">
        <p class="text-[10px] text-brand-slate uppercase font-bold tracking-widest">Canteen Express Secure Terminal</p>
    </footer>

</body>
</html>
