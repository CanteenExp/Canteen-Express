{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-8">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-zinc-100 shadow-2xl space-y-6">
        <div class="text-center">
            <div class="w-14 h-14 bg-emerald-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-lg shadow-emerald-600/30">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h2 class="text-2xl font-black text-zinc-900 mt-3">Delivery Personnel Portal</h2>
            <p class="text-zinc-500 text-xs mt-1">Sign in with your Delivery Rider credentials</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {% if error %}
                <div class="bg-red-50 text-red-600 p-3 rounded-xl text-xs font-semibold">
                    <p>{{ error }}</p>
                </div>
            {% endif %}

            <div>
                <label class="block text-xs font-extrabold text-zinc-700 uppercase tracking-wider mb-1">Username</label>
                <input type="text" name="username" required placeholder="Rider username"
                       class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-extrabold text-zinc-700 uppercase tracking-wider mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/20 transition">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Rider Login
            </button>
        </form>

        <div class="text-center pt-2 border-t border-zinc-100">
            <a href="{% url 'accounts:landing' %}" class="text-xs font-bold text-zinc-500 hover:text-emerald-600 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Role Selection
            </a>
        </div>
    </div>
</div>
{% endblock %}
