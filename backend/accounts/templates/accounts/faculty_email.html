{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{% static 'customer_portal/images/canteen-express-logo.png' %}" type="image/png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Onboarding - Step 3: Corporate Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-zinc-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6 relative z-10">
        <!-- Progress Bar -->
        <div class="space-y-2">
            <div class="flex justify-between text-xs font-extrabold text-zinc-400 uppercase tracking-wider">
                <span class="text-orange-600">Step 3 of 5</span>
                <span>Corporate Email</span>
            </div>
            <div class="w-full bg-zinc-100 h-2 rounded-full overflow-hidden">
                <div class="bg-orange-500 h-full w-3/5"></div>
            </div>
        </div>

        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
                <i class="fa-solid fa-envelope-circle-check text-2xl"></i>
            </div>
            <h2 class="text-2xl font-black text-zinc-900">Verify Faculty Email</h2>
            <p class="text-xs text-zinc-500 leading-relaxed">Please enter your official institutional email ending in @psu.palawan.edu.ph.</p>
        </div>

        {% if error %}
        <div class="p-3 bg-red-50 border border-red-200 text-red-600 rounded-2xl text-xs font-bold flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-extrabold text-zinc-700 uppercase tracking-wider mb-1">Institutional Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-zinc-400 text-xs">
                        <i class="fa-solid fa-at"></i>
                    </span>
                    <input type="email" name="corp_email" required placeholder="faculty.name@psu.palawan.edu.ph"
                        class="w-full pl-10 pr-4 py-3 border border-zinc-200 rounded-2xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-xs text-zinc-800 font-bold">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-2xl shadow-lg shadow-orange-500/25 transition text-xs uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer relative z-20">
                <span>Verify & Continue</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="text-center pt-2 border-t border-zinc-100">
            <a href="{% url 'accounts:faculty_phone' %}" class="text-xs font-bold text-zinc-400 hover:text-zinc-700 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </a>
        </div>
    </div>

</body>
</html>
