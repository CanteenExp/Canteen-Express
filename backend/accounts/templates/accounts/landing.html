<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Express - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.85; }
        }
        .animate-pulse-logo {
            animation: pulseLogo 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-500 via-orange-600 to-amber-700 min-h-screen flex items-center justify-center p-4">

    <!-- 1. Splash Screen Overlay -->
    <div id="splash-screen" class="fixed inset-0 bg-orange-600 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-700">
        <div class="animate-pulse-logo flex flex-col items-center">
            <div class="w-24 h-24 bg-white text-orange-600 rounded-full flex items-center justify-center shadow-2xl mb-4">
                <i class="fa-solid fa-utensils text-5xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider">CANTEEN EXPRESS</h1>
            <p class="text-sm font-light text-orange-100 mt-1">Smart & Fast Ordering</p>
        </div>
        <div class="mt-8 flex items-center space-x-2">
            <div class="w-3 h-3 bg-white rounded-full animate-bounce"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-bounce [animation-delay:-0.15s]"></div>
            <div class="w-3 h-3 bg-white rounded-full animate-bounce [animation-delay:-0.3s]"></div>
        </div>
    </div>

    <!-- 2. Role Selection Main Content -->
    <div id="main-content" class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 sm:p-8 opacity-0 transition-opacity duration-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-utensils text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Welcome to Canteen Express!</h2>
            <p class="text-sm text-gray-500 mt-1">Please select your account role to continue</p>
        </div>

        <div class="space-y-4">
            <!-- Student Option -->
            <a href="{% url 'accounts:select_student' %}" class="group block w-full border-2 border-gray-200 hover:border-orange-500 rounded-xl p-4 transition shadow-sm hover:shadow-md">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition">
                        <i class="fa-solid fa-graduation-cap text-xl"></i>
                    </div>
                    <div class="text-left flex-1">
                        <h3 class="font-bold text-gray-800 group-hover:text-orange-600 transition">Student</h3>
                        <p class="text-xs text-gray-500">Quick order for Dine-In & Pickup</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-orange-500 transition"></i>
                </div>
            </a>

            <!-- Faculty / Staff Option -->
            <a href="{% url 'accounts:faculty_location' %}" class="group block w-full border-2 border-gray-200 hover:border-orange-500 rounded-xl p-4 transition shadow-sm hover:shadow-md">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-lg flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition">
                        <i class="fa-solid fa-user-tie text-xl"></i>
                    </div>
                    <div class="text-left flex-1">
                        <h3 class="font-bold text-gray-800 group-hover:text-orange-600 transition">Faculty / Staff</h3>
                        <p class="text-xs text-gray-500">Unlocks Office Delivery features</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-orange-500 transition"></i>
                </div>
            </a>
        </div>

        <div class="mt-8 text-center border-t pt-4">
            <p class="text-xs text-gray-400">Already registered? <a href="{% url 'accounts:login' %}" class="text-orange-600 font-semibold hover:underline">Log In</a></p>
        </div>
    </div>

    <script>
        // Automatic Transition from Splash Screen to Main Content
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const main = document.getElementById('main-content');
                
                splash.classList.add('opacity-0');
                setTimeout(() => {
                    splash.style.display = 'none';
                    main.classList.remove('opacity-0');
                }, 700);
            }, 2000); // 2 Seconds display time
        });
    </script>
</body>
</html>
