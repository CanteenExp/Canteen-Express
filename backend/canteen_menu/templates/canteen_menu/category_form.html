{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{% static 'customer_portal/images/canteen-express-logo.png' %}" type="image/png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action_title }} - Canteen Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-zinc-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-800 border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
            <h1 class="text-lg font-black text-orange-500">{{ action_title }}</h1>
            <a href="{% url 'canteen_menu:staff_menu_list' %}" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></a>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            {% for field in form %}
            <div class="space-y-1">
                <label class="block font-bold text-zinc-300 uppercase tracking-wider">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-400 text-[10px] mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <div class="pt-4 flex items-center gap-3">
                <a href="{% url 'canteen_menu:staff_menu_list' %}" class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl text-center transition">Cancel</a>
                <button type="submit" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-black py-3 rounded-xl shadow-lg shadow-orange-600/30 transition">Save Category</button>
            </div>
        </form>
    </div>
</body>
</html>
