{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{% static 'customer_portal/images/canteen-express-logo.png' %}" type="image/png" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item - Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white min-h-screen p-4 flex items-center justify-center">
    <div class="max-w-md w-full bg-zinc-800 p-6 rounded-3xl border border-white/10 text-center space-y-4 shadow-2xl">
        <h3 class="text-xl font-black text-red-500">Sigurado ka bang buburahin ito?</h3>
        <p class="text-xs text-zinc-400">Ang item na <span class="font-bold text-white">"{{ item.name }}"</span> ay permanenteng mabubura sa database.</p>
        
        <form method="POST" class="flex gap-3 pt-4">
            {% csrf_token %}
            <a href="{% url 'canteen_menu:staff_menu_list' %}" class="w-1/2 bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition">Kanselahin</a>
            <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition">Oo, Burahin</button>
        </form>
    </div>
</body>
</html>
