{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-8">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-zinc-100 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-4xl">🍱</span>
            <h2 class="text-2xl font-black text-zinc-900 mt-2">Canteen Express</h2>
            <p class="text-zinc-500 text-sm mt-1">Sign in to start ordering your meals</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-red-50 text-red-600 p-3 rounded-xl text-xs font-semibold">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <div>
                <label class="block text-xs font-extrabold text-zinc-700 uppercase tracking-wider mb-1">Username</label>
                <input type="text" name="username" required placeholder="Enter username"
                       class="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-extrabold text-zinc-700 uppercase tracking-wider mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="login-password" name="password" required placeholder="••••••••"
                           class="w-full px-4 py-3 pr-12 rounded-xl border border-zinc-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm">
                    <button type="button" onclick="togglePassword('login-password', this)" title="Show/Hide password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800 cursor-pointer text-base p-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg active:scale-90 transition">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-orange-500/20 transition duration-200">
                Log In 
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-zinc-500 border-t border-zinc-100 pt-5">
            New here? 
            <a href="{% url 'accounts:faculty_auth' %}" class="text-orange-500 font-bold hover:underline">Create an account</a>
        </div>
    </div>
</div>
<script>
    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    }
</script>
{% endblock %}
