{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-center">Verify Your Account</h2>
    <p class="text-sm text-gray-600 text-center mb-6">
        We sent a 6-digit verification code to <strong>{{ email }}</strong>. Please enter it below:
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">OTP Code</label>
            <input type="text" name="otp_code" maxlength="6" required 
                   class="w-full px-3 py-2 border rounded-lg text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" 
                   placeholder="123456">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition duration-200">
            Verify & Activate
        </button>
    </form>
</div>
{% endblock %}
