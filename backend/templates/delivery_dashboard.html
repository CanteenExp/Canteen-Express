{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Delivery Header -->
    <div class="bg-zinc-900 text-white p-6 rounded-2xl mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-l-8 border-emerald-500 shadow-xl">
        <div>
            <h1 class="text-2xl font-black tracking-wide">🛵 Delivery Express Hub</h1>
            <p class="text-zinc-400 text-sm mt-1">Delivery Personnel Portal — Active Drop-offs</p>
        </div>
        <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-3 py-1.5 rounded-full text-xs tracking-wider uppercase">
            RIDER POV
        </span>
    </div>

    <!-- Active Deliveries List -->
    <div class="space-y-4">
        <div class="bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-xs font-extrabold text-emerald-600 uppercase tracking-wider bg-emerald-50 px-2 py-0.5 rounded">Ready for Pickup</span>
                    <span class="text-xs font-bold text-zinc-400">#1002</span>
                </div>
                <h3 class="text-lg font-bold text-zinc-900">Faculty Building — Room 302</h3>
                <p class="text-sm text-zinc-500">Customer: Prof. Santos | 1x Chicken Sandwich, 1x Coffee</p>
            </div>

            <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow transition whitespace-nowrap">
                Accept Delivery 🛵
            </button>
        </div>
    </div>
</div>
{% endblock %}
