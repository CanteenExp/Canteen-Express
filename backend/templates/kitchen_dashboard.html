{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
    <!-- Kitchen Header -->
    <div class="bg-zinc-900 text-white p-6 rounded-2xl mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-l-8 border-orange-500 shadow-xl">
        <div>
            <h1 class="text-2xl font-black tracking-wide">👨‍🍳 Kitchen Display System (KDS)</h1>
            <p class="text-zinc-400 text-sm mt-1">Canteen Staff Portal — Order Preparation Queue</p>
        </div>
        <span class="bg-orange-500/20 text-orange-400 border border-orange-500/30 font-bold px-3 py-1.5 rounded-full text-xs tracking-wider uppercase">
            STAFF POV
        </span>
    </div>

    <!-- Active Orders Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-white border-2 border-orange-400 rounded-2xl p-5 shadow-md flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center pb-3 border-b border-zinc-100 mb-3">
                    <span class="font-black text-zinc-900 text-lg">Order #1001</span>
                    <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">
                        Pending
                    </span>
                </div>
                
                <div class="space-y-2 mb-4">
                    <div class="flex justify-between text-sm">
                        <span class="font-bold text-zinc-800">1x Porksilog w/ Extra Rice</span>
                        <span class="text-zinc-500">₱85.00</span>
                    </div>
                </div>

                <div class="bg-zinc-50 p-3 rounded-xl border border-zinc-100 text-xs text-zinc-500 mb-4">
                    <p><strong class="text-zinc-700">Customer:</strong> Juan Cruz (Student)</p>
                    <p><strong class="text-zinc-700">Type:</strong> Pick-up</p>
                </div>
            </div>

            <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-sm shadow transition">
                Start Preparing 🍳
            </button>
        </div>
    </div>
</div>
{% endblock %}
