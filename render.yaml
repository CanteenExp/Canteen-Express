services:
  - type: web
    name: canteen-express
    env: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      python backend/manage.py collectstatic --noinput
      python backend/manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.hchqdkuijbpihraagetz
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      # Email / SMTP -- REQUIRED for faculty OTP (registration & password reset).
      # EMAIL_HOST_PASSWORD must be set in the Render dashboard (sync: false)
      # with a Gmail App Password, otherwise deployed OTP emails will fail and
      # the on-screen fallback is DISABLED in production (no code leak).
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 465
      - key: EMAIL_USE_SSL
        value: true
      - key: EMAIL_HOST_USER
        value: canteenexpress26@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Canteen Express <canteenexpress26@gmail.com>
      - key: EMAIL_TIMEOUT
        value: 10
      # Admin/System governance PIN. Replace with your own value in the
      # Render dashboard; the app defaults to a dev-only fallback otherwise.
      - key: ADMIN_PIN
        sync: false
